name: Qualify distributed CLI 0.15.6 LSP policy lifecycle
on:
  workflow_dispatch:
    inputs:
      profile_sha256:
        description: Exact reviewed finalized requests/cli0156/profile.json SHA-256
        required: true
        type: string
      profile:
        description: Fixed QA-only request and feed namespace to exercise
        required: true
        default: lsp
        type: choice
        options: [lsp]
      reviewed_commit:
        description: Exact reviewed workflow commit on main
        required: true
        type: string
      request_sha256:
        description: Exact SHA-256 of the reviewed request selected by the fixed profile
        required: true
        type: string
env:
  QA_CLI_PROFILE: cli0156
  CLI0156_PROFILE_SHA256: ${{ inputs.profile_sha256 }}
permissions:
  contents: read
concurrency:
  group: registry-qa-lifecycle
  cancel-in-progress: false
jobs:
  policy:
    if: github.repository == 'merkr-software/cadencr-registry-qa' && github.repository_id == '1420296872' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      QA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      QA_POLICY_PROFILE: ${{ inputs.profile }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact QA-only dispatch before accessing secrets
        run: |
          python3 scripts/cli0156/guard.py
          node scripts/registry-cli-qa/policy-guard.mjs --guard-only
      - name: Fetch only pinned distributed ELF
        run: sh scripts/fetch-cli0156.sh requests/cli0156/released-cli.env "$RUNNER_TEMP/qa-cli"
      - name: Sign, publish, renew, replay and roll back inert QA policies
        env:
          QA_SIGNING_KEY_PEM: ${{ secrets.QA_SIGNING_KEY_PEM }}
          CADENCR_REGISTRY_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/registry-cli-qa/policy.mjs
      - name: Upload strict allowlist of key-free policy proofs and envelopes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-policy-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qa-policy-public/policy-proof.json
            ${{ runner.temp }}/qa-policy-public/policy-failure.json
            ${{ runner.temp }}/qa-policy-public/provider-bootstrap.json
            ${{ runner.temp }}/qa-policy-public/provider-renewed.json
            ${{ runner.temp }}/qa-policy-public/theme-bootstrap.json
            ${{ runner.temp }}/qa-policy-public/theme-renewed.json
            ${{ runner.temp }}/qa-policy-public/tab-bootstrap.json
            ${{ runner.temp }}/qa-policy-public/tab-renewed.json
            ${{ runner.temp }}/qa-policy-public/lsp-bootstrap.json
            ${{ runner.temp }}/qa-policy-public/lsp-renewed.json
          include-hidden-files: false
          retention-days: 14
          if-no-files-found: warn
