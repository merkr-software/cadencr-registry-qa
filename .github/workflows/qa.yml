name: Public registry lifecycle QA
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Reviewed request to run
        required: true
        type: choice
        options: [initial, renewal]
      request_sha256:
        description: Exact SHA-256 of reviewed requests/<phase>.json
        required: true
        type: string
      reviewed_commit:
        description: Exact commit being dispatched
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: registry-qa-lifecycle
  cancel-in-progress: false
jobs:
  first:
    if: github.repository == 'merkr-software/cadencr-registry-qa' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact trusted dispatch before accessing secrets
        env:
          QA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          QA_RUNNER: first
          PHASE: ${{ inputs.phase }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: node scripts/guard.mjs
      - name: Fetch exact distributed CLI (no source fallback)
        run: sh scripts/fetch-released-cli.sh cli-pin.env "$RUNNER_TEMP/qa-cli"
      - name: Run publication and same-state replay
        env:
          QA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          QA_RUNNER: first
          PHASE: ${{ inputs.phase }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          QA_SIGNING_KEY_PEM: ${{ secrets.QA_SIGNING_KEY_PEM }}
          CADENCR_REGISTRY_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run.mjs
      - name: Retain public diagnostic receipts (never restored)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-${{ inputs.phase }}-first-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qa-public/*-index.json
            ${{ runner.temp }}/qa-public/*-mirror.json
            ${{ runner.temp }}/qa-public/publish.json
            ${{ runner.temp }}/qa-public/same-state-replay.json
          include-hidden-files: false
          retention-days: 14
          if-no-files-found: warn

  fresh:
    needs: first
    if: github.repository == 'merkr-software/cadencr-registry-qa' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact trusted dispatch before accessing secrets
        env:
          QA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          QA_RUNNER: fresh
          PHASE: ${{ inputs.phase }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: node scripts/guard.mjs
      - name: Fetch exact distributed CLI (no source fallback)
        run: sh scripts/fetch-released-cli.sh cli-pin.env "$RUNNER_TEMP/qa-cli"
      - name: Run publication and same-state replay
        env:
          QA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          QA_RUNNER: fresh
          PHASE: ${{ inputs.phase }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          QA_SIGNING_KEY_PEM: ${{ secrets.QA_SIGNING_KEY_PEM }}
          CADENCR_REGISTRY_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run.mjs
      - name: Retain public diagnostic receipts (never restored)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-${{ inputs.phase }}-fresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qa-public/*-index.json
            ${{ runner.temp }}/qa-public/*-mirror.json
            ${{ runner.temp }}/qa-public/publish.json
            ${{ runner.temp }}/qa-public/same-state-replay.json
          include-hidden-files: false
          retention-days: 14
          if-no-files-found: warn
